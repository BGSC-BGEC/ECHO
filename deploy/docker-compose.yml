# On the VPS: set ECHO_DOMAIN (DNS A record -> VPS IP), then
#   ECHO_DOMAIN=echo.example.com docker compose -f deploy/docker-compose.yml up -d --build
# Phones then use: wss://echo.example.com/ws
services:
  server:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    volumes: [echo-data:/data]
    expose: ["8787"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
    environment:
      ECHO_DOMAIN: ${ECHO_DOMAIN:?set ECHO_DOMAIN to your domain, e.g. echo.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [server]
volumes:
  echo-data:
  caddy-data:
